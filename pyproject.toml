[project]
name = "airsentinel"
version = "0.1.0"
description = ""
authors = [
    {name = "NajatelOtmani",email = "elotmani.najat@etu.uae.ac.ma"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "mlflow (>=3.14.0,<4.0.0)",
    "fastapi (>=0.138.2,<0.139.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "kafka-python (>=3.0.7,<4.0.0)",
    "pandera[extras] (>=0.32.1,<0.33.0)",
    "kafka-python-ng (>=2.2.3,<3.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "pytorch-lightning (>=2.6.5,<3.0.0)",
    "lightning (>=2.6.5,<3.0.0)",
    "langchain-classic (>=1.0.8,<2.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "streamlit (>=1.63.0,<2.0.0)",
    "pydeck (>=0.9.3,<0.10.0)",
    "requests (>=2.34.2,<3.0.0)",
    "fpdf2 (>=2.8.8,<3.0.0)",
    "prometheus-fastapi-instrumentator (>=8.1.0,<9.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "langchain (>=1.4.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]
