[project]
name = "airsentinel"
version = "0.1.0"
description = ""
authors = [
    {name = "NajatelOtmani",email = "elotmani.najat@etu.uae.ac.ma"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "mlflow (>=3.14.0,<4.0.0)",
    "fastapi (>=0.138.2,<0.139.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "kafka-python (>=3.0.7,<4.0.0)",
    "pandera[extras] (>=0.32.1,<0.33.0)",
    "kafka-python-ng (>=2.2.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]
