version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: airsentinel_timescaledb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - airsentinel_net


  redis:
    image: redis:7-alpine
    container_name: airsentinel_redis
    ports:
      - "6379:6379"
    networks:
      - airsentinel_net

  minio:
    image: minio/minio:latest
    container_name: airsentinel_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - airsentinel_net

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: airsentinel_mlflow
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "5000:5000"
    command: >
      bash -c "
      mlflow db upgrade postgresql://${DB_USER}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME} &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME}
      --default-artifact-root s3://mlflow-artifacts/
      "
    networks:
      - airsentinel_net

  # --- STREAMING INFRASTRUCTURE ADDITIONS ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: airsentinel_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - airsentinel_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: airsentinel_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Allows localhost access for host scripts and airsentinel_net access for containers
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - airsentinel_net

networks:
  airsentinel_net:
    driver: bridge

volumes:
  timescale_data:
  minio_data:
